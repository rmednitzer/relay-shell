# relay-shell resource envelope and explicit host-administrator execution contract.
# See docs/adr/0002-no-sandbox-full-access.md. The daemon retains its dedicated
# account; operator-authorized sudo supplies root for individual commands.
# Authentication, transport restrictions, audit records and tool admission policy
# remain mandatory and are not disabled by these service settings.

[Service]
MemoryHigh=768M
MemoryMax=1024M
CPUQuota=80%
TasksMax=128
LimitNOFILE=8192
UMask=0077

# Do not inherit a reduced capability bounding set or a private host view.
# In particular ProtectClock/KernelLogs/KernelModules silently remove root caps;
# PrivateTmp also creates a mount namespace, hiding the host's actual /tmp.
CapabilityBoundingSet=~
NoNewPrivileges=no
PrivateTmp=no
PrivateDevices=no
PrivateUsers=no
PrivateMounts=no
PrivateNetwork=no
ProtectSystem=no
ProtectHome=no
ProtectHostname=no
ProtectClock=no
ProtectKernelTunables=no
ProtectKernelLogs=no
ProtectKernelModules=no
ProtectControlGroups=no
RestrictRealtime=no
LockPersonality=no
RestrictNamespaces=no
SystemCallFilter=

# Optional systemd credential delivery is independent of the execution contract.
# LoadCredentialEncrypted=relay-shell-oauth:/etc/credstore.encrypted/relay-shell-oauth
