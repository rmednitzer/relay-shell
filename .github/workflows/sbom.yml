name: sbom

# Generates a CycloneDX SBOM (JSON + XML) of the resolved Python
# environment for each release tag and attaches it to the GitHub release.
# Cheap supply-chain signal: lists every runtime dependency that ships
# with the wheel, with version pins, hashes, and PURLs. No runtime
# change to the package itself.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach an SBOM to (e.g. v0.2.0)"
        required: true
        type: string

# Default the workflow token to read-only; the sbom job escalates to
# contents: write only for the release-asset upload, per the GitHub Actions
# hardening guide (least privilege). (CI-2)
permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # final step uploads the SBOM assets to the release
      id-token: write   # CI-3: OIDC token for Sigstore build-provenance signing
      attestations: write   # CI-3: write the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Resolve tag
        id: tag
        # Pass event-controlled values through env vars instead of
        # interpolating them into the shell, so a crafted tag/input cannot
        # inject into the script (CI-2; GitHub Actions hardening guide).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signed release tag against protected main
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 1
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          release_commit="$(git rev-list -n1 "refs/tags/$RELEASE_TAG^{}")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main || {
            echo "ERROR: release tag points outside protected main" >&2
            exit 1
          }
          signers="$(mktemp)"
          trap 'rm -f "$signers"' EXIT
          git show refs/remotes/origin/main:deploy/release-signing.pub > "$signers"
          test -s "$signers"
          git -c "gpg.ssh.allowedSignersFile=$signers" tag -v "$RELEASE_TAG"

      - name: Install runtime + SBOM tool into a clean venv
        run: |
          python -m venv .sbom-venv
          . .sbom-venv/bin/activate
          python -m pip install --upgrade pip
          # Install the package's runtime dependencies (not the dev extra).
          # Pinning to requirements.txt keeps the SBOM aligned with the
          # validated build set. requirements.txt carries no --hash entries,
          # so pip does not require hashes by default.
          pip install -r requirements.txt
          pip install .
          pip install "cyclonedx-bom>=4,<6"

      - name: Generate CycloneDX SBOM
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          . .sbom-venv/bin/activate
          OUT_JSON="relay-shell-${TAG_NAME}.cdx.json"
          OUT_XML="relay-shell-${TAG_NAME}.cdx.xml"
          # `--of JSON` / `--of XML` is the canonical flag in cyclonedx-py
          # >=4.x; `-o` is the output-file flag. CDX 1.5 is the default
          # spec version (1.6 exists; held at 1.5 for SIEM compatibility).
          cyclonedx-py environment \
            --of JSON \
            --output-reproducible \
            -o "$OUT_JSON"
          cyclonedx-py environment \
            --of XML \
            --output-reproducible \
            -o "$OUT_XML"
          # Sanity: the SBOM must contain the relay-shell component and
          # the version that triggered the workflow.
          python - "$OUT_JSON" "$TAG_NAME" <<'PY'
          import json, re, sys
          path, tag = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          comps = {c.get("name"): c.get("version") for c in data.get("components", [])}
          assert "mcp" in comps, "SBOM missing core dependency 'mcp'"
          # Tag is like v0.2.0; allow either match or just presence of relay-shell.
          # The package may appear with name 'relay-shell' or 'relay_shell'.
          rs = comps.get("relay-shell") or comps.get("relay_shell")
          assert rs is not None, "SBOM missing relay-shell component"
          stripped = re.sub(r"^v", "", tag)
          if stripped and not stripped.startswith("0.0"):
              # Best-effort: warn but do not fail when running workflow_dispatch
              # against a non-canonical tag.
              if rs != stripped:
                  print(f"::warning::relay-shell version in SBOM ({rs}) does not match tag ({tag})")
          print(f"SBOM OK: relay-shell={rs}, components={len(comps)}")
          PY

      - name: Attest SBOM build provenance
        # CI-3: emit a Sigstore-signed in-toto build-provenance attestation for
        # each SBOM file, mirroring release.yml's attestation of the wheels.
        # This records, in the public transparency log, which workflow run and
        # commit produced this SBOM — so a consumer can verify the SBOM is the
        # genuine output of this repo's CI (`gh attestation verify <file>
        # --repo ${{ github.repository }}`) rather than a swapped artifact.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            relay-shell-${{ steps.tag.outputs.name }}.cdx.json
            relay-shell-${{ steps.tag.outputs.name }}.cdx.xml

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom-${{ steps.tag.outputs.name }}
          path: |
            relay-shell-${{ steps.tag.outputs.name }}.cdx.json
            relay-shell-${{ steps.tag.outputs.name }}.cdx.xml
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable release with SBOM assets atomically
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$TAG_NAME"
          # Published releases cannot accept late or replaced assets when
          # immutability is enabled. Publish the SBOM assets in the initial
          # creation request; attested workflow artifacts remain available
          # even when this job is re-run for an existing release.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not mutating release assets"
            exit 0
          fi
          gh release create "$TAG" \
            "relay-shell-${TAG}.cdx.json" \
            "relay-shell-${TAG}.cdx.xml" \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
