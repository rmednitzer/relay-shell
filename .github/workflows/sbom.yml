name: sbom

# Generates a CycloneDX SBOM (JSON + XML) of the package's RUNTIME environment
# for each release tag and attaches it to the GitHub release. Two jobs keep the
# privileges away from the package installs (A14-D7):
#
#   sbom     - read-only token. Verifies the signed tag, builds a clean venv with
#              only the runtime dependencies (complete hashed profile for current
#              tags, legacy direct constraints for historical tags), runs hash-locked
#              cyclonedx-bom from a separate venv against it, and uploads the files as an artifact.
#   publish  - contents: write + OIDC. Installs nothing: downloads the artifact,
#              attests it and creates the immutable release.
#
# The SBOM lists name, version and PURL per component. Transitive dependencies are
# installed from a complete runtime profile for new tags. Historical signed tags
# without profile files retain their direct-constraint recovery path; the SBOM
# records actual installed distributions in either case.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach an SBOM to (e.g. v0.2.0)"
        required: true
        type: string

# Default the workflow token to read-only; only the publish job escalates to
# contents: write for release publication, per the GitHub Actions
# hardening guide (least privilege). (CI-2)
permissions:
  contents: read

jobs:
  sbom:
    # A workflow_dispatch run executes the workflow file of the ref it was started
    # from; only trust it from the protected default branch. Tag pushes are unaffected.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # this job installs third-party packages: no write, no OIDC
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"

      - name: Resolve tag
        id: tag
        # Pass event-controlled values through env vars instead of
        # interpolating them into the shell, so a crafted tag/input cannot
        # inject into the script (CI-2; GitHub Actions hardening guide).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signed release tag against protected main
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+.-][0-9A-Za-z.-]+)?$ ]] || exit 1
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          release_commit="$(git rev-list -n1 "refs/tags/$RELEASE_TAG^{}")"
          test "$(git rev-parse HEAD)" = "$release_commit"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main || {
            echo "ERROR: release tag points outside protected main" >&2
            exit 1
          }
          signers="$(mktemp)"
          trap 'rm -f "$signers"' EXIT
          git show refs/remotes/origin/main:deploy/release-signing.pub > "$signers"
          test -s "$signers"
          git -c "gpg.ssh.allowedSignersFile=$signers" tag -v "$RELEASE_TAG"

      - name: Fetch the hash-locked SBOM tool from the workflow revision
        # Backfilling an SBOM for an older tag checks out that old commit, which
        # predates requirements-sbom.txt; take the lock from the commit this
        # workflow runs at (the tag's commit on a push, `main` on a dispatch).
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${REPO}/contents/requirements-sbom.txt?ref=${WORKFLOW_SHA}" \
            > "$RUNNER_TEMP/requirements-sbom.txt"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${REPO}/contents/requirements-build.txt?ref=${WORKFLOW_SHA}" \
            > "$RUNNER_TEMP/requirements-build.txt"
          test -s "$RUNNER_TEMP/requirements-sbom.txt"
          test -s "$RUNNER_TEMP/requirements-build.txt"

      - name: Install runtime dependencies and the hash-locked SBOM tool
        run: |
          # Runtime environment: the package plus its dependencies only. The
          # direct pins in requirements.txt are constraints (not requirements), so
          # the dev/CI tools listed there are NOT installed and do not reach the SBOM.
          python -m venv .sbom-venv
          if [ -r requirements/runtime-py3.14.txt ]; then
            python -m venv .sbom-builder
            .sbom-builder/bin/python -m pip install --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/requirements-build.txt"
            .sbom-builder/bin/python -m build --wheel --no-isolation --outdir .sbom-dist
            .sbom-venv/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements/runtime-py3.14.txt
            .sbom-venv/bin/python -m pip install --no-index --no-deps .sbom-dist/*.whl
          else
            # Explicit historical-tag compatibility; not a fully locked runtime profile.
            .sbom-venv/bin/python -m pip install -c requirements.txt .
          fi
          .sbom-venv/bin/python -m pip check
          # The SBOM tool lives in its own venv, from the hash-locked file, so it
          # is not itself listed as a component of the environment it describes.
          python -m venv .sbom-tool
          .sbom-tool/bin/python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements-sbom.txt"

      - name: Generate CycloneDX SBOM
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          OUT_JSON="relay-shell-${TAG_NAME}.cdx.json"
          OUT_XML="relay-shell-${TAG_NAME}.cdx.xml"
          # `--of JSON` / `--of XML` select the format and `-o` the output file.
          # The spec version is pinned explicitly (`--sv 1.5`): the generator's
          # own default moved to 1.6 in 7.x, and 1.5 is held for SIEM
          # compatibility.
          .sbom-tool/bin/cyclonedx-py environment \
            --of JSON \
            --sv 1.5 \
            --output-reproducible \
            -o "$OUT_JSON" \
            .sbom-venv/bin/python
          .sbom-tool/bin/cyclonedx-py environment \
            --of XML \
            --sv 1.5 \
            --output-reproducible \
            -o "$OUT_XML" \
            .sbom-venv/bin/python
          # Sanity: the SBOM must contain the relay-shell component and
          # the version that triggered the workflow.
          .sbom-tool/bin/python - "$OUT_JSON" "$TAG_NAME" <<'PY'
          import json, sys
          from packaging.version import Version
          path, tag = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          if data.get("specVersion") != "1.5":
              raise SystemExit("SBOM_SPEC_REFUSED")
          comps = {c.get("name"): c.get("version") for c in data.get("components", [])}
          if "mcp" not in comps:
              raise SystemExit("SBOM_RUNTIME_REFUSED")
          rs = comps.get("relay-shell") or comps.get("relay_shell")
          if rs is None or Version(rs) != Version(tag.removeprefix("v")):
              raise SystemExit("SBOM_RELEASE_IDENTITY_REFUSED")
          print(f"SBOM OK: relay-shell={rs}, components={len(comps)}")
          PY

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom-${{ steps.tag.outputs.name }}
          path: |
            relay-shell-${{ steps.tag.outputs.name }}.cdx.json
            relay-shell-${{ steps.tag.outputs.name }}.cdx.xml
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Attest and publish the SBOM
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # creates the release with the SBOM assets
      actions: read     # downloads the artifact produced by the sbom job
      id-token: write   # CI-3: OIDC token for Sigstore build-provenance signing
      attestations: write   # CI-3: write the provenance attestation
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: sbom-${{ needs.sbom.outputs.tag }}
          path: sbom/

      - name: Attest SBOM build provenance
        # CI-3: emit a Sigstore-signed in-toto build-provenance attestation for
        # each SBOM file, mirroring release.yml's attestation of the wheels.
        # This records, in the public transparency log, which workflow run and
        # commit produced this SBOM — so a consumer can verify the SBOM is the
        # genuine output of this repo's CI (`gh attestation verify <file>
        # --repo ${{ github.repository }}`) rather than a swapped artifact.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            sbom/relay-shell-${{ needs.sbom.outputs.tag }}.cdx.json
            sbom/relay-shell-${{ needs.sbom.outputs.tag }}.cdx.xml

      - name: Publish immutable release with SBOM assets atomically
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.sbom.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$TAG_NAME"
          # Published releases cannot accept late or replaced assets when
          # immutability is enabled. Publish the SBOM assets in the initial
          # creation request; attested workflow artifacts remain available
          # even when this job is re-run for an existing release.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; not mutating release assets"
            exit 0
          fi
          gh release create "$TAG" \
            "sbom/relay-shell-${TAG}.cdx.json" \
            "sbom/relay-shell-${TAG}.cdx.xml" \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
