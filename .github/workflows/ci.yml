name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


# Coalesce initial PR attempts; isolate reruns and retain non-PR evidence.
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name }}-${{
    github.run_attempt == '1' && github.event.pull_request.number || github.run_id
    }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  check:
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      # Qualify the native Python minor for each supported Ubuntu LTS.
      # Both profiles must pass independently, including binary-only lock admission.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            os-version: "24.04"
            python-version: "3.12"
          - os: ubuntu-26.04
            os-version: "26.04"
            python-version: "3.14"
    name: check (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements/development-py${{ matrix.python-version }}.txt

      - name: Verify the qualified OS and Python profile
        env:
          EXPECTED_UBUNTU: ${{ matrix.os-version }}
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, platform, sys
          release = platform.freedesktop_os_release()
          actual_python = f"{sys.version_info.major}.{sys.version_info.minor}"
          if release["ID"] != "ubuntu" or release["VERSION_ID"] != os.environ["EXPECTED_UBUNTU"]:
              raise SystemExit(f"Unexpected OS profile: {release}")
          if actual_python != os.environ["EXPECTED_PYTHON"]:
              raise SystemExit(f"Unexpected Python profile: {actual_python}")
          PY

      - name: Install
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r "requirements/development-py${{ matrix.python-version }}.txt"
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check
          # Wire subprocess coverage: the stdio e2e launches `python -m
          # relay_shell` in a child, so without this the server.py wrappers
          # register as uncovered. The .pth runs at every interpreter start;
          # COVERAGE_PROCESS_START gates the actual recording to runs that opt
          # in. See `docs/runbook.md` §4.3.
          python -c "import site, pathlib; \
            pathlib.Path(site.getsitepackages()[0], 'coverage_subprocess.pth') \
              .write_text('import coverage; coverage.process_startup()\n')"

      # A14-D10: the edge routing tests need a Caddy that understands `persist_config`
      # (2.7+; the distro package is older). Built from the pinned module version, whose
      # contents the Go checksum database verifies, on one matrix leg only.
      - name: Install Caddy (edge routing tests)
        if: matrix.python-version == '3.14'
        env:
          GOBIN: ${{ runner.temp }}/caddy-bin
          # Avoid checksum-service HTTP/2 stream failures; TLS and Go sums stay enabled.
          GODEBUG: http2client=0
        run: |
          command -v go
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.7
          echo "CADDY_BINARY=$GOBIN/caddy" >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy

      - name: Test (pytest with coverage)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
        run: |
          coverage erase
          coverage run -m pytest -q
          coverage combine
          coverage report

      # A14-T1: the seccomp-notify end-to-end tests need CAP_SYS_ADMIN, which the unprivileged
      # test step above lacks, so they auto-skip there. Run them once under sudo (last step, so
      # root-owned files cannot affect the steps before it). They still skip themselves if the
      # runner kernel does not support the notify channel; -rs prints that reason.
      - name: Test (seccomp-notify end to end, privileged)
        if: matrix.python-version == '3.14'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          sudo -E "$(command -v python)" -c 'from relay_shell.seccomp import platform_support; s=platform_support(); print(s); s.ok or exit("privileged seccomp coverage unavailable")'
          sudo -E "$(command -v python)" -m pytest -m seccomp -q -rs -p no:cacheprovider tests/test_seccomp.py
