name: CI aggregate

on:
  pull_request:

permissions:
  checks: read
  contents: read

jobs:
  ci-success:
    name: ci-success
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      REQUIRED_CHECKS: |-
        check (py3.12)
        check (py3.13)
        check (py3.14)
        gitleaks (secret scan)
        pip-audit (CVE scan)
        dependency-review
        Analyze (python) (python)
        Analyze (actions)
      # Empty by design. Add an exact check name here only when a skipped
      # result is an explicitly valid outcome for that protected dependency.
      ALLOWED_SKIPPED_CHECKS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require protected checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot=$(mktemp)
          trap 'rm -f "$snapshot"' EXIT
          deadline=$((SECONDS + 1500))
          while :; do
            # One paginated snapshot per poll, rather than one API call per name.
            # An API failure is a failure, never an empty/successful snapshot.
            gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" \
              -f filter=all -F per_page=100 > "$snapshot"
            result=0
            python3 scripts/check_ci_checks.py < "$snapshot" || result=$?
            case "$result" in
              0) exit 0 ;;
              2) ;;
              *) echo '::error::Protected dependency failed or snapshot invalid'; exit 1 ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo '::error::Timed out waiting for protected dependencies'
              exit 1
            fi
            sleep 10
          done
