name: release

# Build + publish on a signed `v*` tag using PyPI trusted publishing
# (OIDC, no long-lived token). The flow has four gated jobs:
#
#   1. verify     - the tag is annotated, SSH-signed against the trusted key
#                   in deploy/release-signing.pub, and matches the version
#                   declared in pyproject.toml
#   2. build      - dev install (direct pins from requirements.txt as
#                   constraints), full test suite on Python 3.14 (per-PR CI
#                   exercises the 3.12-3.14 matrix), then `python -m build`
#                   to produce wheel + sdist. Build tooling comes from the
#                   hash-locked requirements-build.txt and the build runs with
#                   --no-isolation so no unpinned backend is fetched. This job
#                   installs packages, so it holds NO OIDC or write token.
#   3. attest     - downloads the dist artifact and signs a SLSA build
#                   provenance attestation. It installs nothing, so the
#                   id-token / attestations permissions never share a job
#                   with third-party package installs (A14-D7).
#   4. publish    - downloads the dist artifact and uploads to PyPI via
#                   OIDC, gated on the `pypi` environment so a human can
#                   require an approval click before the release goes live
#
# The PyPI side is wired through the trusted-publishing form at
# https://pypi.org/manage/account/publishing/ with:
#   project = relay-shell     owner = rmednitzer
#   repository = relay-shell  workflow = release.yml
#   environment = pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist and be signed)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify signed tag + version match
    # A workflow_dispatch run executes the workflow file of the ref it was
    # started from; only trust it from the protected default branch, never from
    # an edited feature branch. Tag pushes (the normal path) are unaffected.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_commit: ${{ steps.verify_tag.outputs.release_commit }}
    steps:
      - name: Resolve tag from trigger
        id: tag
        env:
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="${REF#refs/tags/}"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([+.\-].+)?$'; then
            echo "ERROR: $tag does not match the v<MAJOR>.<MINOR>.<PATCH> pattern" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Check out the RESOLVED tag, not the default branch. On a
      # `workflow_dispatch` re-run for an older tag, the default branch may
      # have moved past it - reading `pyproject.toml` from the working tree
      # without this `ref` would compare the tag against whatever version
      # currently sits on the default branch and falsely reject a valid
      # signed tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          # No step after checkout uses git auth (the tag signature is
          # verified locally against deploy/release-signing.pub, and the
          # version check reads the working tree), so do not persist the
          # token in .git/config (CI-2 finding; matches the SEC-2 posture).
          persist-credentials: false

      - name: Assert tag matches pyproject version (at the tagged commit)
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "v$version" ]; then
            echo "ERROR: tag $TAG does not match pyproject version v$version (read from the tagged commit)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OK: tag $TAG matches pyproject version $version"

      - name: Verify tag signature locally
        id: verify_tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Ensure the tag object is annotated (not lightweight)
          obj_type=$(git cat-file -t "refs/tags/$TAG")
          if [ "$obj_type" != "tag" ]; then
            echo "ERROR: $TAG is a lightweight tag; release tags MUST be annotated and signed" >&2
            exit 1
          fi
          release_commit=$(git rev-list -n1 "${TAG}^{}")
          test -n "$release_commit"
          # A tag is not an authority for its own signer trust anchor.
          # Fetch the protected default branch independently and require the
          # tagged commit to have passed the main-branch merge gate.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "ERROR: tagged release commit is not reachable from protected main" >&2
            exit 1
          fi
          # Load authorized signers from protected main, NOT from the tag's
          # checkout (which could otherwise supply an attacker-owned key).
          signers="$(mktemp)"
          trap 'rm -f "$signers"' EXIT
          git show refs/remotes/origin/main:deploy/release-signing.pub > "$signers"
          test -s "$signers"
          # Verify the tag signature against the protected-main trust anchor.
          if ! git -c "gpg.ssh.allowedSignersFile=$signers" tag -v "$TAG"; then
            echo "ERROR: $TAG signature verification failed" >&2
            exit 1
          fi
          # Extract the peeled commit SHA
          release_commit=$(git rev-list -n1 "${TAG}^{}")
          if [ -z "$release_commit" ]; then
            echo "ERROR: could not resolve peeled commit for $TAG" >&2
            exit 1
          fi
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "OK: $TAG is a signed annotated tag (verified locally); release commit $release_commit"

  build:
    name: Build wheel + sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Installs third-party packages, so: read-only token, no OIDC, no
    # attestation rights (those live in the `attest` job, which installs nothing).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ needs.verify.outputs.release_commit }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          # No pip cache on the release path: nothing restored from a shared
          # cache may influence what is built and signed.

      - name: Install build tooling (hash-locked) and the package
        run: |
          # Build tooling first, from the hash-locked file, so the later
          # --no-build-isolation installs and `python -m build` use these exact
          # (not freshly resolved) hatchling/build/twine.
          python -m pip install --require-hashes -r requirements-build.txt
          # Direct dependency pins from requirements.txt act as constraints.
          python -m pip install --no-build-isolation -c requirements.txt -e ".[dev]"

      - name: Run full test suite
        run: pytest -q

      - name: Build wheel + sdist
        run: python -m build --no-isolation

      - name: Check distributions
        run: twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: dist-${{ needs.verify.outputs.version }}
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Sigstore OIDC + attestation publishing for the SLSA v1.2 Build Track
      # L3 provenance attestation. Job-level `permissions:` REPLACES the
      # workflow-level default, so keep `contents: read` explicit and add
      # `actions: read` for the artifact download. This job runs no package
      # installs and no repository code.
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist-${{ needs.verify.outputs.version }}
          path: dist/

      - name: Generate SLSA Build Provenance attestation
        # Produces a Sigstore-signed in-toto attestation linking the workflow
        # run + commit SHA to every artifact under dist/ (the exact files the
        # publish job uploads). PyPI OIDC trusted publishing already provides
        # L2; this adds a verifier-checkable provenance record in Sigstore's
        # public transparency log.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: 'dist/*'

  publish:
    name: Publish to PyPI (OIDC)
    needs: [verify, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/relay-shell
    permissions:
      # Job-level `permissions:` REPLACES the workflow-level block. OIDC
      # for trusted publishing needs id-token; `actions/download-artifact`
      # needs `actions: read` to fetch the artifact uploaded by the
      # previous job; `contents: read` is the minimum for the repo
      # context the action expects.
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: dist-${{ needs.verify.outputs.version }}
          path: dist/

      - name: Publish via PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Make a workflow re-run after a successful upload idempotent
          # instead of failing on "file already exists" - the runbook
          # documents `workflow_dispatch` as the recovery path when PyPI
          # was flaky mid-publish.
          skip-existing: true
