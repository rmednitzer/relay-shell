name: pip-audit

# CVE scan of the resolved Python dependency tree on every PR + push to
# main, plus a daily rerun so a CVE landing against a pinned dep
# surfaces within 24h instead of waiting for the next release-time
# audit. dependency-review-action (on PR) only reviews *added*
# dependencies; pip-audit covers the whole graph.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:35 UTC daily. The odd minute mirrors nightly-fuzz so the audit
    # signals appear close together in the activity timeline.
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: read


# Superseded PR work may stop; every non-PR run keeps its own evidence.
concurrency:
  group: pip-audit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements/development-py3.14.txt
            requirements-audit.txt

      - name: Prepare separate locked subject and audit-tool environments
        run: |
          python -m venv .audit-runtime
          .audit-runtime/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements/development-py3.14.txt
          .audit-runtime/bin/python -m pip install --no-deps --no-build-isolation -e ".[dev,http]"
          .audit-runtime/bin/python -m pip check
          python -m venv .audit-tool
          .audit-tool/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-audit.txt
          .audit-tool/bin/python -m pip check
          audit_path=$(.audit-runtime/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "AUDIT_SITE_PACKAGES=$audit_path" >> "$GITHUB_ENV"

      - name: Run pip-audit
        # `--skip-editable` excludes the local editable `relay-shell` install:
        # pip-audit resolves each distribution on PyPI for known CVEs, but the
        # project itself is not a third-party dependency to audit, and an
        # unreleased in-repo version (e.g. a release-prep bump before the tag is
        # published) is not on PyPI. `--strict` is intentionally NOT combined
        # with it: --strict treats the skipped editable project as an incomplete
        # audit and fails ("distribution marked as editable"). Every actual
        # third-party dependency (incl. the [dev]/[http] extras) is on PyPI and
        # still audited, and pip-audit still exits non-zero on any CVE found.
        run: .audit-tool/bin/pip-audit --path "$AUDIT_SITE_PACKAGES" --skip-editable

      - name: Audit the hash-locked release and SBOM tooling
        # requirements-build.txt / requirements-sbom.txt feed the jobs that build,
        # sign and publish (A14-D7); they are not part of the package's own tree, so
        # audit them explicitly. They are fully pinned, so no resolution is needed.
        run: |
          .audit-tool/bin/pip-audit --disable-pip --no-deps -r requirements-build.txt
          .audit-tool/bin/pip-audit --disable-pip --no-deps -r requirements-sbom.txt
          .audit-tool/bin/pip-audit --disable-pip --no-deps -r requirements-audit.txt

