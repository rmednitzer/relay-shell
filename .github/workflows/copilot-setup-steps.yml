name: Copilot development setup
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements.txt
      - requirements-build.txt
      - "requirements/**"
      - pyproject.toml
permissions:
  contents: read

# Coalesce initial PR attempts; isolate reruns and retain non-PR evidence.
concurrency:
  group: >-
    copilot-setup-steps-${{ github.workflow }}-${{ github.event_name }}-${{
    github.run_attempt == '1' && github.event.pull_request.number || github.run_id
    }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Prepare the constrained development environment
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development-py3.14.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check
      - name: Verify tools and representative test discovery
        run: |
          ruff --version
          mypy --version
          python -m pytest --collect-only -q tests/test_stdio_e2e.py tests/test_ssh_integration.py
