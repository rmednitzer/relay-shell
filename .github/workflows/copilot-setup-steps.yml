name: Copilot development setup
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements.txt
      - requirements-build.txt
      - pyproject.toml
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Prepare the constrained development environment
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-build-isolation -c requirements.txt -e ".[dev]"
          python -m pip check
      - name: Verify tools and representative test discovery
        run: |
          ruff --version
          mypy --version
          python -m pytest --collect-only -q tests/test_stdio_e2e.py tests/test_ssh_integration.py
