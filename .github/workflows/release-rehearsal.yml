name: Release preparation rehearsal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


# Coalesce initial PR attempts; isolate reruns and retain non-PR evidence.
concurrency:
  group: >-
    release-rehearsal-${{ github.workflow }}-${{ github.event_name }}-${{
    github.run_attempt == '1' && github.event.pull_request.number || github.run_id
    }}-${{ github.run_attempt }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  rehearse:
    name: package-and-install-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Prepare the locked rehearsal driver
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development-py3.14.txt
      - name: Rehearse package preparation and complete runtime restoration
        run: python scripts/rehearse_release.py --output "$RUNNER_TEMP/release-rehearsal"
      - name: Qualify actual installation and service-state recovery on the disposable VM
        run: sudo -E /usr/bin/python3 scripts/rehearse_install.py --output "$RUNNER_TEMP/install-rehearsal"
      - name: Retain installer recovery receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: install-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/install-rehearsal/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain source-bound rehearsal evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/release-rehearsal/
          if-no-files-found: error
          retention-days: 30

  cross-version:
    name: cross-version-recovery
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: build-python
        with:
          python-version: "3.12"
      - name: Prepare hash-locked build tools
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development-py3.12.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Prepare independent audit tools with their locked interpreter
        run: |
          python -m venv .legacy-audit-tool
          .legacy-audit-tool/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-audit.txt
      - name: Audit the complete frozen baseline without executing it
        run: |
          set +e
          .legacy-audit-tool/bin/pip-audit --requirement tests/fixtures/upgrade-v0.3/runtime.lock --require-hashes --disable-pip --strict --progress-spinner off --format json --output "$RUNNER_TEMP/legacy-audit.json"
          audit_result=$?
          set -e
          test "$audit_result" -eq 0 || test "$audit_result" -eq 1
          test -s "$RUNNER_TEMP/legacy-audit.json"
      - name: Qualify admitted release upgrade and explicit rollback
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 scripts/rehearse_upgrade.py --build-python "${{ steps.build-python.outputs.python-path }}" --audit-report "$RUNNER_TEMP/legacy-audit.json" --output "$RUNNER_TEMP/upgrade-rehearsal"
      - name: Retain cross-version source-bound receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upgrade-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-rehearsal/receipt.json
          if-no-files-found: error
          retention-days: 30

  release-rehearsal:
    name: release-rehearsal
    if: ${{ always() }}
    needs: [rehearse, cross-version]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require package, installer and cross-version recovery
        env:
          PACKAGE_RESULT: ${{ needs.rehearse.result }}
          UPGRADE_RESULT: ${{ needs.cross-version.result }}
        run: test "$PACKAGE_RESULT" = success && test "$UPGRADE_RESULT" = success
