name: Release preparation rehearsal

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    name: release-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Prepare the locked rehearsal driver
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development-py3.14.txt
      - name: Rehearse package preparation and complete runtime restoration
        run: python scripts/rehearse_release.py --output "$RUNNER_TEMP/release-rehearsal"
      - name: Retain source-bound rehearsal evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/release-rehearsal/
          if-no-files-found: error
          retention-days: 30
